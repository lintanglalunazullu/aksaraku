<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aksaraku Teacher - Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { workspace: '#0B0F17', sidebar: '#121824', bubbleAi: '#181E2A', bubbleUser: '#232B3B', inputbar: '#1A202C' } } } };
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body data-role="teacher" class="bg-workspace text-slate-100 antialiased">
  <div class="flex h-screen overflow-hidden">
    <aside class="hidden w-64 shrink-0 border-r border-white/5 bg-sidebar p-5 md:block">
      <div class="flex items-center gap-3"><div class="rounded-lg bg-emerald-500 p-2 text-slate-950"><i data-lucide="graduation-cap" class="h-5 w-5"></i></div><div><p class="font-extrabold">AKSARAKU</p><p class="text-[10px] tracking-[0.2em] text-emerald-400">TEACHER</p></div></div>
      <a href="./chat.html" class="mt-8 flex items-center gap-3 rounded-lg bg-emerald-500/15 px-3 py-3 text-sm font-semibold text-emerald-300"><i data-lucide="message-circle" class="h-4 w-4"></i>Chat</a>
      <a href="../pages/signout.html" class="mt-2 flex items-center gap-3 rounded-lg px-3 py-3 text-sm text-slate-400 hover:bg-white/5 hover:text-white"><i data-lucide="log-out" class="h-4 w-4"></i>Keluar</a>
    </aside>
    <section class="relative flex min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-between border-b border-white/5 px-5"><div class="flex items-center gap-3"><i data-lucide="graduation-cap" class="h-5 w-5 text-emerald-400"></i><h1 class="font-bold">Chat Teacher</h1></div><button id="newResearchBtn" type="button" class="rounded-lg bg-emerald-500 px-3 py-2 text-sm font-bold text-slate-950">Chat Baru</button></header>
      <main id="chatThread" class="flex-1 overflow-y-auto px-4 py-6"><div class="mx-auto max-w-3xl space-y-6"><div class="flex items-start gap-3"><div class="rounded-lg bg-emerald-500 p-2 text-slate-950"><i data-lucide="graduation-cap" class="h-4 w-4"></i></div><div class="rounded-2xl rounded-tl-sm border border-white/5 bg-bubbleAi px-4 py-3.5"><p class="text-sm leading-relaxed">Halo, Teacher. Silakan mulai diskusi akademik bersama Aksaraku.</p></div></div></div></main>
      <div class="border-t border-white/5 bg-workspace p-4"><form id="chatForm" class="mx-auto flex max-w-3xl gap-2 rounded-xl border border-slate-700 bg-inputbar p-2"><input id="chatInput" type="text" autocomplete="off" placeholder="Tanya Aksaraku apa saja..." class="min-w-0 flex-1 bg-transparent px-2 outline-none" /><button id="sendBtn" type="submit" disabled class="rounded-full bg-emerald-500 px-4 py-2 font-bold text-slate-950 disabled:opacity-40">Kirim</button></form></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth-role.js"></script>
  <script>
    window.requireAksarakuRole(['teacher'], './login.html').catch(() => window.location.replace('./login.html'));
  </script>
  <script src="../js/chat.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
