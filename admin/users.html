<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aksaraku Admin - User</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.tailwindcss.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    #usersTable_wrapper .dt-layout-row { margin: 1rem 0; }
    #usersTable_wrapper select, #usersTable_wrapper input { border-radius: .5rem; border: 1px solid #334155; background: #020617; color: #e2e8f0; padding: .45rem .65rem; }
    #usersTable_wrapper .dt-info, #usersTable_wrapper .dt-length, #usersTable_wrapper .dt-search { color: #94a3b8; font-size: .8rem; }
    #usersTable_wrapper .dt-paging-button { color: #cbd5e1 !important; }
    #usersTable_wrapper .dt-paging-button.current { background: #7c3aed !important; border-color: #7c3aed !important; color: white !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div class="flex min-h-screen">
    <aside class="hidden w-64 shrink-0 border-r border-white/5 bg-[#121824] p-5 md:block">
      <div class="flex items-center gap-3">
        <div class="rounded-lg bg-gradient-to-br from-purple-500 to-indigo-600 p-2"><i data-lucide="book-open" class="h-5 w-5"></i></div>
        <div><p class="font-extrabold tracking-wide">AKSARAKU</p><p class="text-[10px] font-semibold tracking-[0.2em] text-purple-400">ADMIN PORTAL</p></div>
      </div>
      <a href="./chat.html" class="mt-8 flex items-center justify-center gap-2 rounded-lg bg-purple-600 px-3 py-2.5 text-sm font-bold hover:bg-purple-500"><i data-lucide="message-circle-plus" class="h-4 w-4"></i>Chat Baru</a>
      <nav class="mt-8 space-y-1">
        <a href="./index.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-400 hover:bg-white/5 hover:text-white"><i data-lucide="layout-dashboard" class="h-4 w-4"></i>Dashboard</a>
        <a href="./upload.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-400 hover:bg-white/5 hover:text-white"><i data-lucide="file-up" class="h-4 w-4"></i>Upload Dokumen</a>
        <a href="./chat.html" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-400 hover:bg-white/5 hover:text-white"><i data-lucide="message-circle" class="h-4 w-4"></i>Chat</a>
        <a href="./users.html" class="flex items-center gap-3 rounded-lg bg-purple-700/80 px-3 py-2.5 text-sm font-semibold text-white"><i data-lucide="users" class="h-4 w-4"></i>User</a>
      </nav>
      <a href="./signout.html" class="mt-8 flex items-center gap-3 border-t border-white/5 px-3 pt-5 text-sm text-slate-400 hover:text-white"><i data-lucide="log-out" class="h-4 w-4"></i>Sign Out</a>
    </aside>
    <main class="min-w-0 flex-1 px-5 py-8 md:px-8">
    <header class="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-6">
      <div><a href="./index.html" class="text-sm text-purple-300 hover:text-purple-200">&larr; Dashboard</a><h1 class="mt-3 text-3xl font-bold">Manajemen User</h1><p class="mt-1 text-sm text-slate-400">Profil baru dibuat otomatis oleh trigger Supabase Auth. Kelola role admin, user, serta teacher di sini.</p></div>
      <button id="newUserButton" class="flex items-center gap-2 rounded-lg bg-purple-600 px-4 py-2.5 text-sm font-bold hover:bg-purple-500"><i data-lucide="user-plus" class="h-4 w-4"></i>User baru</button>
    </header>
    <p id="status" class="mt-5 hidden rounded-lg border px-4 py-3 text-sm" role="status"></p>
    <section class="mt-6 grid gap-6">
      <form id="userForm" class="hidden h-fit space-y-4 rounded-xl border border-white/10 bg-slate-900 p-5">
        <h2 id="formTitle" class="text-lg font-bold">Tambah profil</h2>
        <label class="block text-sm text-slate-300">Email<input id="email" type="email" required class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 outline-none focus:border-purple-400" /></label>
        <label id="passwordField" class="block text-sm text-slate-300">Password<input id="password" type="password" minlength="6" placeholder="Minimal 6 karakter" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 outline-none focus:border-purple-400" /><span class="mt-1 block text-xs text-slate-500">Akun Auth dan profil dibuat otomatis.</span></label>
        <label class="block text-sm text-slate-300">Nama lengkap<input id="fullName" type="text" required class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 outline-none focus:border-purple-400" /></label>
        <label class="block text-sm text-slate-300">Provider<select id="provider" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 outline-none focus:border-purple-400"><option value="email">email</option><option value="google">google</option><option value="github">github</option><option value="other">other</option></select></label>
        <label class="block text-sm text-slate-300">Role<select id="role" class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 outline-none focus:border-purple-400"><option value="user">user</option><option value="teacher">teacher</option><option value="admin">admin</option></select><span id="roleHint" class="mt-1 block text-xs text-slate-500">Pilih role akun saat dibuat.</span></label>
        <div class="flex gap-2"><button type="submit" class="flex-1 rounded-lg bg-purple-600 px-3 py-2.5 text-sm font-bold hover:bg-purple-500">Simpan</button><button id="cancelButton" type="button" class="rounded-lg border border-slate-700 px-3 py-2.5 text-sm text-slate-300 hover:bg-white/5">Batal</button></div>
      </form>
      <section class="min-w-0 overflow-hidden rounded-xl border border-white/10 bg-slate-900 p-4">
        <div class="mb-4 flex flex-wrap gap-2" id="roleFilters">
          <button type="button" data-role-filter="" class="rounded-lg bg-purple-600 px-3 py-2 text-xs font-semibold text-white">Semua</button>
          <button type="button" data-role-filter="admin" class="rounded-lg border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 hover:bg-white/5">Admin</button>
          <button type="button" data-role-filter="user" class="rounded-lg border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 hover:bg-white/5">User</button>
          <button type="button" data-role-filter="teacher" class="rounded-lg border border-slate-700 px-3 py-2 text-xs font-semibold text-slate-300 hover:bg-white/5">Teacher</button>
        </div>
        <div class="overflow-x-auto"><table id="usersTable" class="w-full text-left text-sm"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Provider</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
      </section>
    </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.tailwindcss.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth-role.js"></script>
  <script src="../js/admin-users.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
